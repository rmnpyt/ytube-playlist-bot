# Alembic configuration.
#
# The script location is the package, not a top-level migrations directory, so the
# migrations travel with the code they describe. Nothing secret belongs here: the URL
# is set from the environment by bot.services.storage.migrations, and the placeholder
# below only satisfies Alembic's parser.
#
# Usage:
#   alembic revision --autogenerate -m "add jobs table"
#   alembic upgrade head
#
# The bot itself does not call the command line; it calls apply_migrations() at startup.

[alembic]
script_location = bot/services/storage/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytube-playlist-bot"
version = "2.0.0"
description = "Telegram bot that downloads YouTube videos and playlists and delivers them as files."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "rmnpyt" }]
keywords = ["telegram", "bot", "youtube", "yt-dlp", "downloader"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "python-telegram-bot==22.8",
  "yt-dlp>=2026.8.19",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
  "SQLAlchemy[asyncio]>=2.1.3",
  "aiosqlite>=0.21.0",
  "alembic>=1.20.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.15.0",
  "pre-commit>=4.1.0",
]

[project.scripts]
ytube-bot = "bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["bot", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # comprehensions
  "DTZ",  # naive datetimes
  "T20",  # no print in library code
  "SIM",  # simplifiable code
  "RET",  # return statements
  "ARG",  # unused arguments
  "PTH",  # prefer pathlib
  "ASYNC",# blocking calls in async code
  "RUF",  # ruff-specific
  "PL",   # pylint
  "S",    # bandit
  "TID",  # tidy imports
  "PIE",  # misc lints
  "G",    # logging format
  "LOG",  # logging misuse
  "TC",   # type-checking imports
]
ignore = [
  "E501",    # line length is enforced by the formatter
  "COM812",  # missing trailing comma: conflicts with the formatter
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic value comparison
  "ISC001",  # implicit string concat: formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is the point of a test
  "S105",    # hardcoded test credentials
  "S106",    # hardcoded test passwords
  "S311",    # pseudo-random is fine in tests
  "ARG001",  # fixtures passed but unused
  "ARG002",
  "PLR2004", # assertions compare against literal numbers
  "TC001",   # fixtures moving into TYPE_CHECKING blocks
  "TC002",
  "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict on the application, pragmatic in tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
mypy_path = "bot"
files = ["bot", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=bot",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
  "-m",
  "not network",
]
markers = [
  "network: requires internet access, deselected by default",
  "slow: takes more than a couple of seconds",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["bot"]
branch = true
omit = ["bot/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "pragma: no cover",
]

# ---------------------------------------------------------------------------
# Coverage HTML report for local debugging
# ---------------------------------------------------------------------------
[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# Pytest markers are declared above; keep bandit happy about the config file
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]
